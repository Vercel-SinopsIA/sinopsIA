name: Deploy SinopsIA to GitHub Pages

on:
  push:
    branches:
      - ghpages-production
      - prueba
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Frontend/SinopsIA/package-lock.json

      - name: Install Frontend dependencies
        working-directory: Frontend/SinopsIA
        run: npm ci

      - name: Build Frontend
        working-directory: Frontend/SinopsIA
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY || vars.CLERK_PUBLISHABLE_KEY || 'pk_test_ZW5kbGVzcy1jb3lvdGUtOTA5MC5jbGVyay5hY2NvdW50cy5kZXYk' }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY || secrets.CLERK_PUBLISHABLE_KEY || vars.VITE_CLERK_PUBLISHABLE_KEY || vars.CLERK_PUBLISHABLE_KEY || 'pk_test_ZW5kbGVzcy1jb3lvdGUtOTA5MC5jbGVyay5hY2NvdW50cy5kZXYk' }}
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: Frontend/SinopsIA/dist
          branch: gh-pages
          clean: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: Frontend/SinopsIA/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
